name: Publish Business OS Print Agent

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-print-agent.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download current Print Agent build
        run: |
          curl --fail --location --retry 3 -o BusinessOSPrintAgent-win-x64.zip 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-8ffc-8211-af77-e7cb7deccdfa/raw?se=2026-09-05T15%3A49%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=b0ed7363-bded-5a50-abb9-aa174caca061&skoid=6fa9748a-b7b2-4b56-a932-8c1417549c47&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T00%3A30%3A40Z&ske=2026-09-06T00%3A30%3A40Z&sks=b&skv=2026-02-06&sig=qD1z4JNoepZEXwo3tR5/3ZKCaFTfuzcSGNCEJc4cK5g%3D'
          unzip -q BusinessOSPrintAgent-win-x64.zip
          test -f BusinessOSPrintAgent.exe

      - name: Publish public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create print-agent-latest             BusinessOSPrintAgent.exe             BusinessOSPrintAgent-win-x64.zip             --repo "$GITHUB_REPOSITORY"             --title "Business OS Print Agent"             --notes "Актуальная версия Business OS Print Agent для Windows x64."
